<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon site</title>

    <style>
      h1 {
  animation: arrivee 1.5s ease-out;
}

@keyframes arrivee {
  from {
      transform: translateX(100px);
      opacity: 0;
  }

  to {
      transform: translateX(0);
      opacity: 1;
  }
}
    </style>
</head>

<body>

    <h1>Mon premier site !</h1>

</body>
</html>
